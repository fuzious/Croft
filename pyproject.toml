[project]
name = "security-oracle"
version = "0.1.0"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.143.1",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.7.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-rust>=0.24.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
llm = [
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["near"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
