[project]
name = "security-oracle"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.143.1",
    "laya>=0.4.7",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "web3>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
