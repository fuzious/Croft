<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="330" rx="16" fill="#072621"/>
  <text x="40" y="52" fill="#1FE38A" font-size="13" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MEASURED ON NEAR INTENTS HISTORY</text>
  <text x="40" y="86" fill="#F2F5F3" font-size="26" font-weight="700">Catches the known exploits. Stays quiet on normal traffic.</text>

  <!-- row 1 -->
  <text x="40" y="146" fill="#F2F5F3" font-size="17" font-weight="600">Real exploit transactions</text>
  <text x="40" y="168" fill="#8FA9A2" font-size="14">flagged by the accounting check</text>
  <rect x="340" y="140" width="350" height="22" rx="11" fill="#11392f"/>
  <rect x="340" y="140" width="350" height="22" rx="11" fill="#1FE38A"/>
  <text x="840" y="158" fill="#F2F5F3" font-size="20" font-weight="700" text-anchor="end">23 / 23</text>

  <!-- row 2 -->
  <text x="40" y="216" fill="#F2F5F3" font-size="17" font-weight="600">Exploits replayed in a sandbox</text>
  <text x="40" y="238" fill="#8FA9A2" font-size="14">credit defects flagged</text>
  <rect x="340" y="210" width="350" height="22" rx="11" fill="#11392f"/>
  <rect x="340" y="210" width="350" height="22" rx="11" fill="#1FE38A"/>
  <text x="840" y="228" fill="#F2F5F3" font-size="20" font-weight="700" text-anchor="end">712 / 712</text>

  <!-- row 3 -->
  <text x="40" y="286" fill="#F2F5F3" font-size="17" font-weight="600">Held-out normal transactions</text>
  <text x="40" y="308" fill="#8FA9A2" font-size="14">raising a high alert</text>
  <rect x="340" y="280" width="350" height="22" rx="11" fill="#11392f"/>
  <text x="840" y="298" fill="#F2F5F3" font-size="20" font-weight="700" text-anchor="end">0 / 7,400</text>
